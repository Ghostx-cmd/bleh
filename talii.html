<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>for u mommy :33</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Mrs+Saint+Delafield&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: sans-serif;
  }

  #canvas-container {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 2;
  }

  /* thin wobbling center line that reacts to the cursor — sits behind the 3D scene
     so the bouquet's flowers naturally occlude it instead of drawing on top */
  #wobble-line {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
    pointer-events: none;
  }

  #title {
    position: fixed;
    top: 6.5vh;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Great Vibes', cursive;
    font-size: clamp(38px, 8vw, 90px);
    font-weight: 400;
    text-align: center;
    z-index: 10;
    pointer-events: none;
    letter-spacing: 2px;
    white-space: nowrap;
    background: linear-gradient(90deg, #ffc2e2, #d9b8ff, #b7d4ff);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    filter: drop-shadow(0 0 14px rgba(255,190,230,0.35)) drop-shadow(0 0 22px rgba(180,160,255,0.25));
  }
</style>
</head>
<body>

<div id="title">for u mommy :33</div>
<div id="canvas-container"></div>

<canvas id="wobble-line"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
// ---------- BASIC SETUP ----------
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 2.2, 9);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setClearColor(0x000000, 0);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 4;
controls.maxDistance = 18;
controls.target.set(0, 1.2, 0);
controls.enablePan = true;
controls.autoRotate = false;
controls.autoRotateSpeed = 0.6;
controls.update();

// ---------- LIGHTS ----------
scene.add(new THREE.AmbientLight(0x8888ff, 0.55));

const keyLight = new THREE.DirectionalLight(0xffffff, 1.1);
keyLight.position.set(5, 8, 6);
scene.add(keyLight);

const pinkLight = new THREE.PointLight(0xff3fa4, 1.4, 20);
pinkLight.position.set(-4, 3, 3);
scene.add(pinkLight);

const purpleLight = new THREE.PointLight(0x8a2fff, 1.3, 20);
purpleLight.position.set(4, 2, -3);
scene.add(purpleLight);

// ---------- STARRY BACKGROUND ----------
function makeStars(count, radius, sizeMin, sizeMax) {
  const geometry = new THREE.BufferGeometry();
  const positions = [];
  const colors = [];
  const sizes = [];

  const palette = [
    new THREE.Color(0xffffff),
    new THREE.Color(0xffd1f2),
    new THREE.Color(0xb6c9ff),
    new THREE.Color(0xfff3b0),
    new THREE.Color(0xc6a6ff),
    new THREE.Color(0x9cf0ff),
    new THREE.Color(0xff9ecf)
  ];

  for (let i = 0; i < count; i++) {
    const r = radius * (0.55 + Math.random() * 0.45);
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos((Math.random() * 2) - 1);

    const x = r * Math.sin(phi) * Math.cos(theta);
    const y = r * Math.sin(phi) * Math.sin(theta);
    const z = r * Math.cos(phi);

    positions.push(x, y, z);

    const c = palette[Math.floor(Math.random() * palette.length)];
    colors.push(c.r, c.g, c.b);
    sizes.push(sizeMin + Math.random() * (sizeMax - sizeMin));
  }

  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  geometry.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));

  const material = new THREE.PointsMaterial({
    size: 0.12,
    vertexColors: true,
    transparent: true,
    opacity: 0.95,
    sizeAttenuation: true,
    depthWrite: false
  });

  return new THREE.Points(geometry, material);
}

const starsFar = makeStars(2200, 90, 0.05, 0.16);
const starsNear = makeStars(700, 45, 0.08, 0.22);
scene.add(starsFar, starsNear);

// subtle black space fog for depth (background left transparent so the
// wobble-line canvas behind it can show through empty space)
scene.fog = new THREE.FogExp2(0x000000, 0.012);
scene.background = null;

// ---------- LOW-POLY MATERIALS ----------
function flatMat(color, emissive, intensity) {
  return new THREE.MeshPhongMaterial({
    color: color,
    emissive: emissive || 0x000000,
    emissiveIntensity: intensity || 0,
    flatShading: true,
    shininess: 18
  });
}

const stemMat   = flatMat(0x2f7d3a);
const leafMat   = flatMat(0x3fa14a);
const wrapMat   = flatMat(0x1c1c26, 0x0a0a12, 0.3);
const centerMat = flatMat(0xffe066, 0xffb400, 0.25);

const redPalette = [0xff2d55, 0xe0143c, 0xff5470, 0xc4003f];
const purplePalette = [0x8a2fd6, 0xa64bf4, 0x6e1fb8, 0xb46bff];

// ---------- BUILD A LOW-POLY FLOWER ----------
const clickableFlowers = [];

function createFlower(hue) {
  const flower = new THREE.Group();
  const petalColor = hue === 'red'
    ? redPalette[Math.floor(Math.random() * redPalette.length)]
    : purplePalette[Math.floor(Math.random() * purplePalette.length)];

  const petalMat = flatMat(petalColor, petalColor, 0.12);
  const petalCount = 6;
  const petalGeo = new THREE.IcosahedronGeometry(0.34, 0);

  for (let i = 0; i < petalCount; i++) {
    const petal = new THREE.Mesh(petalGeo, petalMat);
    const angle = (i / petalCount) * Math.PI * 2;
    petal.position.set(Math.cos(angle) * 0.36, Math.sin(angle) * 0.36, 0);
    petal.scale.set(1, 0.62, 0.55);
    petal.rotation.z = angle;
    petal.rotation.y = 0.3;
    flower.add(petal);
  }

  // flower center
  const center = new THREE.Mesh(new THREE.IcosahedronGeometry(0.22, 0), centerMat);
  flower.add(center);

  // little sparkle bits around the center
  for (let i = 0; i < 4; i++) {
    const spark = new THREE.Mesh(
      new THREE.TetrahedronGeometry(0.05, 0),
      flatMat(0xffffff, 0xffffff, 0.6)
    );
    const a = Math.random() * Math.PI * 2;
    spark.position.set(Math.cos(a) * 0.22, Math.sin(a) * 0.22, 0.18);
    flower.add(spark);
  }

  flower.userData.baseScale = 1;
  flower.userData.isFlower = true;
  flower.userData.pulseUntil = 0;

  clickableFlowers.push(flower);
  return flower;
}

function createLeaf() {
  const leaf = new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.55, 4), leafMat);
  leaf.scale.set(1, 1, 0.25);
  return leaf;
}

// ---------- BOUQUET GROUP ----------
const bouquet = new THREE.Group();
scene.add(bouquet);

// Stems converge toward a bunch point near the bottom, flowers fan out at top
const flowerLayout = [
  { hue: 'red',    pos: [ 0.0, 2.55, 0.0], tilt: [0.05, 0, 0] },
  { hue: 'purple', pos: [-0.75, 2.25, 0.25], tilt: [0.15, -0.3, 0.1] },
  { hue: 'purple', pos: [ 0.75, 2.25, 0.25], tilt: [0.15, 0.3, -0.1] },
  { hue: 'red',    pos: [-1.15, 1.75, -0.15], tilt: [0.3, -0.5, 0.15] },
  { hue: 'red',    pos: [ 1.15, 1.75, -0.15], tilt: [0.3, 0.5, -0.15] },
  { hue: 'purple', pos: [ 0.0, 1.9, 0.65], tilt: [-0.2, 0, 0] },
  { hue: 'purple', pos: [-0.4, 1.55, -0.65], tilt: [0.35, -0.15, 0.2] },
  { hue: 'red',    pos: [ 0.4, 1.55, -0.65], tilt: [0.35, 0.15, -0.2] }
];

const bunchPoint = new THREE.Vector3(0, -0.6, 0);

flowerLayout.forEach(cfg => {
  const flower = createFlower(cfg.hue);
  flower.position.set(cfg.pos[0], cfg.pos[1], cfg.pos[2]);
  flower.rotation.set(cfg.tilt[0], cfg.tilt[1], cfg.tilt[2]);
  bouquet.add(flower);

  // stem: a thin cylinder from bunch point up to just below the flower
  const start = bunchPoint;
  const end = new THREE.Vector3(cfg.pos[0] * 0.55, cfg.pos[1] - 0.25, cfg.pos[2] * 0.55);
  const dir = new THREE.Vector3().subVectors(end, start);
  const len = dir.length();

  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.05, len, 5), stemMat);
  stem.position.copy(start).addScaledVector(dir, 0.5);
  stem.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
  bouquet.add(stem);

  // a leaf or two along some stems
  if (Math.random() > 0.4) {
    const leaf = createLeaf();
    const t = 0.4 + Math.random() * 0.3;
    leaf.position.copy(start).addScaledVector(dir, t);
    leaf.rotation.z = (cfg.pos[0] < 0 ? 1 : -1) * (Math.PI / 3);
    leaf.rotation.y = Math.random() * Math.PI;
    bouquet.add(leaf);
  }
});

// wrapping paper cone around the stems
const wrap = new THREE.Mesh(new THREE.ConeGeometry(0.95, 2.1, 7, 1, true), wrapMat);
wrap.position.set(0, -1.05, 0);
wrap.rotation.x = Math.PI;
bouquet.add(wrap);

// little wrap fold accents (low poly triangles around the top rim of the wrap)
for (let i = 0; i < 7; i++) {
  const a = (i / 7) * Math.PI * 2;
  const fold = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.4, 3), wrapMat);
  fold.position.set(Math.cos(a) * 0.9, -0.15, Math.sin(a) * 0.9);
  fold.rotation.x = Math.PI * 0.15;
  fold.rotation.y = a;
  bouquet.add(fold);
}

// ---------- BOWTIE ----------
const bowGroup = new THREE.Group();
const ribbonRed = flatMat(0xd6003c, 0xd6003c, 0.15);

function bowWing(mirror) {
  const wing = new THREE.Group();
  const outer = new THREE.Mesh(new THREE.ConeGeometry(0.34, 0.55, 4), ribbonRed);
  outer.rotation.z = mirror ? Math.PI / 2 : -Math.PI / 2;
  outer.scale.set(1, 1, 0.35);
  wing.add(outer);

  const fold = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.3, 4), flatMat(0x9c0030, 0x9c0030, 0.1));
  fold.rotation.z = mirror ? Math.PI / 2 : -Math.PI / 2;
  fold.position.x = mirror ? 0.12 : -0.12;
  fold.scale.set(1, 1, 0.3);
  wing.add(fold);

  return wing;
}

const leftWing = bowWing(false);
leftWing.position.x = -0.28;
const rightWing = bowWing(true);
rightWing.position.x = 0.28;

const knot = new THREE.Mesh(new THREE.IcosahedronGeometry(0.15, 0), flatMat(0xff3060, 0xff3060, 0.3));

bowGroup.add(leftWing, rightWing, knot);
bowGroup.position.set(0, 0.55, 0.55);
bowGroup.rotation.x = -0.15;
bouquet.add(bowGroup);

bouquet.position.y = -0.8;

// ---------- INTERACTION: CLICK TO POP A FLOWER ----------
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const clock = new THREE.Clock();

function onPointerClick(event) {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);

  const hits = raycaster.intersectObjects(clickableFlowers, true);
  if (hits.length > 0) {
    let obj = hits[0].object;
    while (obj.parent && !obj.userData.isFlower) obj = obj.parent;
    if (obj.userData.isFlower) {
      obj.userData.pulseUntil = clock.getElapsedTime() + 0.6;
      obj.userData.pulseStart = clock.getElapsedTime();
    }
  }
}
renderer.domElement.addEventListener('click', onPointerClick);

// ---------- RESIZE ----------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- ANIMATE ----------
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  starsFar.rotation.y = t * 0.004;
  starsNear.rotation.y = -t * 0.006;

  // bouquet stays still and neutral — only the click pulse animates a flower
  clickableFlowers.forEach((flower) => {
    let scale = 1;
    if (t < flower.userData.pulseUntil) {
      const p = (t - flower.userData.pulseStart) / 0.6;
      scale = 1 + Math.sin(p * Math.PI) * 0.35;
    }
    flower.scale.setScalar(scale);
  });

  pinkLight.intensity = 1.2 + Math.sin(t * 1.5) * 0.3;
  purpleLight.intensity = 1.1 + Math.cos(t * 1.3) * 0.3;

  controls.update();
  renderer.render(scene, camera);
}

animate();
</script>

<script>
// ---------- THIN WOBBLING CENTER LINE (reacts to cursor) ----------
(function() {
  const lineCanvas = document.getElementById('wobble-line');
  const lctx = lineCanvas.getContext('2d');

  function resizeLineCanvas() {
    lineCanvas.width = window.innerWidth * window.devicePixelRatio;
    lineCanvas.height = window.innerHeight * window.devicePixelRatio;
    lineCanvas.style.width = window.innerWidth + 'px';
    lineCanvas.style.height = window.innerHeight + 'px';
    lctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
  }
  window.addEventListener('resize', resizeLineCanvas);
  resizeLineCanvas();

  // cursor position, eased toward the real pointer so the pull feels smooth
  let targetX = window.innerWidth / 2;
  let targetY = window.innerHeight / 2;
  let curX = targetX;
  let curY = targetY;
  let hasPointer = false;

  window.addEventListener('mousemove', (e) => {
    targetX = e.clientX;
    targetY = e.clientY;
    hasPointer = true;
  });
  window.addEventListener('touchmove', (e) => {
    if (e.touches && e.touches[0]) {
      targetX = e.touches[0].clientX;
      targetY = e.touches[0].clientY;
      hasPointer = true;
    }
  }, { passive: true });
  window.addEventListener('mouseleave', () => { hasPointer = false; });

  function drawLine(time) {
    requestAnimationFrame(drawLine);

    const w = window.innerWidth;
    const h = window.innerHeight;
    const centerY = h / 2;

    // ease cursor tracking for a smooth, elastic pull rather than a snap
    curX += (targetX - curX) * 0.08;
    curY += (targetY - curY) * 0.08;

    lctx.clearRect(0, 0, w, h);

    // soft colorful, mostly-transparent gradient along the line
    const grad = lctx.createLinearGradient(0, 0, w, 0);
    grad.addColorStop(0.00, 'rgba(120,170,255,0)');
    grad.addColorStop(0.15, 'rgba(120,190,255,0.28)');
    grad.addColorStop(0.38, 'rgba(255,170,220,0.36)');
    grad.addColorStop(0.5,  'rgba(200,170,255,0.38)');
    grad.addColorStop(0.62, 'rgba(160,220,255,0.36)');
    grad.addColorStop(0.85, 'rgba(255,200,170,0.28)');
    grad.addColorStop(1.00, 'rgba(120,170,255,0)');

    const step = 8;
    const influenceRadius = 190;
    const maxPull = hasPointer ? 34 : 0;

    // taper: thickest at the horizontal middle, thinning out toward the edges
    const minHalfWidth = 0.5;
    const maxHalfWidth = 3.4;

    const topPts = [];
    const botPts = [];

    for (let x = 0; x <= w; x += step) {
      // gentle idle wobble so the line is alive even without a cursor nearby
      const idle = Math.sin(x * 0.012 + time * 0.0011) * 3.5
                 + Math.sin(x * 0.027 - time * 0.0007) * 1.8;

      const dist = x - curX;
      const influence = Math.exp(-(dist * dist) / (2 * influenceRadius * influenceRadius));
      const pull = (curY - centerY) * influence * (maxPull / 60);

      const y = centerY + idle + pull;

      const t2 = x / w;
      const bell = Math.sin(Math.PI * t2); // 0 at the edges, 1 at the middle
      const halfWidth = minHalfWidth + (maxHalfWidth - minHalfWidth) * bell;

      topPts.push([x, y - halfWidth]);
      botPts.push([x, y + halfWidth]);
    }

    lctx.beginPath();
    lctx.moveTo(topPts[0][0], topPts[0][1]);
    for (let i = 1; i < topPts.length; i++) lctx.lineTo(topPts[i][0], topPts[i][1]);
    for (let i = botPts.length - 1; i >= 0; i--) lctx.lineTo(botPts[i][0], botPts[i][1]);
    lctx.closePath();

    lctx.fillStyle = grad;
    lctx.shadowBlur = 14;
    lctx.shadowColor = 'rgba(190,190,255,0.45)';
    lctx.fill();
  }

  requestAnimationFrame(drawLine);
})();
</script>
</body>
</html>
